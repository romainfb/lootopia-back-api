<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Créer un artefact — Lootopia Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .admin-header {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 1rem 1.5rem;
        }

        .admin-header span {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .rarity-badge {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .rarity-COMMUNE {
            background: #9e9e9e;
        }

        .rarity-RARE {
            background: #2196f3;
        }

        .rarity-EPIC {
            background: #9c27b0;
        }

        .rarity-LEGENDAIRE {
            background: #ff9800;
        }

        .file-selected {
            font-size: 0.875rem;
            color: #198754;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="admin-header d-flex align-items-center gap-3">
    <strong>Lootopia</strong>
    <span>/ Admin / Artefacts / Créer</span>
</div>

<div class="container py-4" style="max-width: 720px;">

    <h4 class="mb-4">Nouvel artefact</h4>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <div class="card p-4">
        <form enctype="multipart/form-data" method="post"
              novalidate th:action="@{/admin/artefacts/create}" th:object="${artifactRequest}">

            <div class="mb-3">
                <label class="form-label fw-semibold" for="title">Titre <span class="text-danger">*</span></label>
                <input class="form-control" id="title" placeholder="Nom de l'artefact"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" th:field="*{title}"
                       type="text">
                <div class="invalid-feedback" th:errors="*{title}" th:if="${#fields.hasErrors('title')}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold" for="rarity">Rareté <span class="text-danger">*</span></label>
                <select class="form-select" id="rarity"
                        th:classappend="${#fields.hasErrors('rarity')} ? 'is-invalid'" th:field="*{rarity}">
                    <option value="">-- Choisir une rareté --</option>
                    <option th:each="r : ${rarities}" th:text="${r}" th:value="${r}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{rarity}" th:if="${#fields.hasErrors('rarity')}"></div>
                <div class="mt-1 d-flex gap-3 small text-muted">
                    <span><span class="rarity-badge rarity-COMMUNE"></span>Commune</span>
                    <span><span class="rarity-badge rarity-RARE"></span>Rare</span>
                    <span><span class="rarity-badge rarity-EPIC"></span>Épique</span>
                    <span><span class="rarity-badge rarity-LEGENDAIRE"></span>Légendaire</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold" for="description">Description</label>
                <textarea class="form-control" id="description"
                          placeholder="Description facultative" rows="3" th:field="*{description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold" for="image">Modèle 3D <span class="text-danger">*</span></label>
                <input accept=".glb" class="form-control" id="image" name="image"
                       onchange="showFileName(this)"
                       type="file">
                <div class="file-selected" id="file-name"></div>
                <div class="form-text">Format accepté : .glb</div>
                <div class="text-danger small mt-1" th:if="${#fields.hasGlobalErrors()}">
                    <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold" for="cacheId">ID du cache <span
                            class="text-danger">*</span></label>
                    <input class="form-control" id="cacheId" min="1"
                           placeholder="1" th:classappend="${#fields.hasErrors('cacheId')} ? 'is-invalid'"
                           th:field="*{cacheId}" type="number">
                    <div class="invalid-feedback" th:errors="*{cacheId}" th:if="${#fields.hasErrors('cacheId')}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold" for="userId">ID de l'utilisateur <span
                            class="text-danger">*</span></label>
                    <input class="form-control" id="userId" min="1"
                           placeholder="1" th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid'"
                           th:field="*{userId}" type="number">
                    <div class="invalid-feedback" th:errors="*{userId}" th:if="${#fields.hasErrors('userId')}"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
                <button class="btn btn-outline-secondary" onclick="resetPreview()" type="reset">Réinitialiser</button>
                <button class="btn btn-primary" type="submit">Créer l'artefact</button>
            </div>

        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showFileName(input) {
        const label = document.getElementById('file-name');
        label.textContent = input.files[0] ? '✓ ' + input.files[0].name : '';
    }

    function resetPreview() {
        document.getElementById('file-name').textContent = '';
    }
</script>
</body>
</html>
