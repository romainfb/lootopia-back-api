services:
  api:
    build: .
    container_name: lootopia-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - ADMIN_UI_ENABLED=${ADMIN_UI_ENABLED:-false}
    volumes:
      - ./upload:/app/upload
